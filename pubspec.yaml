name: clearbite
description: "A Halal/Haram food ingredient scanner using Google ML Kit and Firebase."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  
  # State Management & DI
  flutter_riverpod: ^2.5.1
  get_it: ^7.7.0
  
  # Firebase Core & Firestore
  firebase_core: ^4.11.0
  cloud_firestore: ^6.6.0
  
  # ML Kit & Camera
  camera: ^0.10.5+9
  google_mlkit_text_recognition: ^0.11.0
  
  # UI Utilities
  cupertino_icons: ^1.0.6
  go_router: ^13.2.0
  google_fonts: ^6.2.1
  firebase_auth: ^6.5.4
  google_sign_in: ^7.2.0
  image_picker: ^1.2.3
  firebase_storage: ^13.4.3
  flutter_native_splash: ^2.4.7
  image_cropper: ^12.2.1
  isar: ^3.1.0+1
  isar_flutter_libs: ^3.1.0+1
  path_provider: ^2.1.6
  crypto: ^3.0.7
  http: ^1.6.0
  mobile_scanner: ^7.3.0
  google_generative_ai: ^0.4.7
  # Analytics & Messaging
  firebase_analytics: 
  firebase_crashlytics: 
  firebase_messaging:
  
  # Localization
  intl: ^0.20.2
  flutter_localizations:
    sdk: flutter
  firebase_app_check: ^0.4.5+2
  flutter_dotenv: ^6.0.1
  shared_preferences: ^2.5.5
  flutter_svg: ^2.3.0
  light: ^5.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  flutter_launcher_icons: ^0.14.4
  build_runner: ^2.4.13
  isar_generator: ^3.1.0+1

flutter:
  uses-material-design: true
  generate: true
  assets:
    - assets/images/
    - .env

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/images/app_icon.png"
